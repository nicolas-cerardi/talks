<!doctype html>
<html>
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

		<title>Template Presentation</title>
		<meta name="description" content="General outreach talk for Geneva observatory tours">
		<meta name="author" content="Nicolas Cerardi">

		<link rel="stylesheet" href="reveal.js/dist/reset.css">
		<link rel="stylesheet" href="reveal.js/dist/reveal.css">
		<link rel="stylesheet" href="reveal.js/dist/theme/darkenergy.css">

		<!-- Theme used for syntax highlighted code -->
		<link rel="stylesheet" href="plugin/highlight/monokai.css" id="highlight-theme">
	</head>
	<body>
		<div class="reveal">
			<div class="slides">
				<section>Welcome to Geneva Observatory !</section>
				<section>
					What do we do here ?
                </section>
				<section>
					Let's do a tour of the Universe
				</section>
				<section>
					The life of stars
				</section>
			</div>
		</div>

        <style>
			.reveal .block {
				background-color: #191919;
				margin-left: 20px;
				margin-right: 20px;
				text-align: left;
				padding-bottom: 0.1em;
			}

			.reveal .block-title {
				background-color: #333333;
				padding: 8px 35px 8px 14px;
				color: #FFAA7F;
				font-weight: bold;
			}

			.reveal .block-content {
				padding: 8px 35px 8px 14px;
			}

			.reveal .slide-title {
				border-left: 5px solid white;
				text-align: left;
				margin-left: 20px;
				padding-left: 20px;
			}

			.reveal .alert {
				color: #FFAA7F;
				font-weight: bold;
			}

			.reveal .inverted {
				filter: invert(100%);
			}
		</style>

		<script src="reveal.js/dist/reveal.js"></script>
		<script src="reveal.js/plugin/notes/notes.js"></script>
		<script src="reveal.js/plugin/markdown/markdown.js"></script>
		<script src="reveal.js/plugin/highlight/highlight.js"></script>
		<script src="reveal.js/plugin/math/math.js"></script>

		<script>
			// More info about initialization & config:
			// - https://revealjs.com/initialization/
			// - https://revealjs.com/config/
			Reveal.initialize({
				hash: true,

				// Learn about plugins: https://revealjs.com/plugins/
				plugins: [ RevealMarkdown, RevealHighlight, RevealNotes, RevealMath.KaTeX],
				slideNumber: true,
			});
		</script>
	</body>
</html>
